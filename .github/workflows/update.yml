name: SENTINEL v3.1 실시간 자동 업데이트

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '30 2 * * *'
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

# Both workflows write the same JSON file. Serialize their executions.
concurrency:
  group: sentinel-data-main
  cancel-in-progress: false

jobs:
  hourly-real-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: 실시간 이벤트 감지
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/detect_events.py

      - name: 커밋 & 푸시 (안전한 fast-forward)
        run: |
          set -euo pipefail
          git config user.name "Sentinel Bot"
          git config user.email "sentinel-bot@github.com"
          git add sentinel-data.json
          if git diff --cached --quiet; then
            echo "변경 없음: 푸시 생략"
            exit 0
          fi
          git commit -m "🚨 Hourly Real-time [${{ github.run_id }}]"
          # Avoid overwrite/force pushes; incorporate any newer commits.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

  daily-update:
    needs: hourly-real-time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4 lxml pytrends

      - name: Daily 업데이트
        run: |
          python3 scripts/update_data.py
          python3 scripts/update_trends.py
          python3 scripts/update_bizjet.py

      - name: 커밋 & 푸시 (안전한 fast-forward)
        run: |
          set -euo pipefail
          git config user.name "Sentinel Bot"
          git config user.email "sentinel-bot@github.com"
          git add sentinel-data.json
          if git diff --cached --quiet; then
            echo "변경 없음: 푸시 생략"
            exit 0
          fi
          git commit -m "📅 Daily Update [${{ github.run_id }}]"
          # Avoid overwrite/force pushes; incorporate any newer commits.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
